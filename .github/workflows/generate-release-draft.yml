defaults:
  run:
    shell: bash

name: Build and Generate Draft Release
on:
  push:
    tags:
      - 'v*.*.*'

# Each job requests only what it needs. Only create-release can write.
permissions: {}

# One run per tag at a time; never cancel a run that may be creating a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      is_alpha: ${{ steps.parse.outputs.is_alpha }}
      tarball: ${{ steps.parse.outputs.tarball }}
      dsc: ${{ steps.parse.outputs.dsc }}
      debian_tar: ${{ steps.parse.outputs.debian_tar }}
      srpm: ${{ steps.parse.outputs.srpm }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: contrib/scripts/release_version
          sparse-checkout-cone-mode: false

      - name: Parse release tag
        id: parse
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chmod +x contrib/scripts/release_version
          eval "$(contrib/scripts/release_version "$RELEASE_TAG")"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "is_alpha=${IS_ALPHA}"
            echo "tarball=${TARBALL}"
            echo "dsc=${DSC}"
            echo "debian_tar=${DEBIAN_TAR}"
            echo "srpm=${SRPM}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - container: ghcr.io/${{ github.repository }}/aws-ofi-nccl-ubuntu:cuda-gcc-latest-none-efalattest
            name: ubuntu
            generate_packages: true
          - container: ghcr.io/${{ github.repository }}/aws-ofi-nccl-al2023:cuda-efalatest
            name: amazonlinux
            generate_packages: false

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    name: Build for ${{ matrix.name }}
    env:
      PLUGIN_TAG: ${{ needs.metadata.outputs.tag }}
      TARBALL: ${{ needs.metadata.outputs.tarball }}
      DSC: ${{ needs.metadata.outputs.dsc }}
      DEBIAN_TAR: ${{ needs.metadata.outputs.debian_tar }}
      SRPM: ${{ needs.metadata.outputs.srpm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Configure and build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./autogen.sh
          ./configure --with-mpi=/opt/amazon/openmpi \
                      --with-libfabric=/opt/amazon/efa \
                      --enable-tests=yes \
                      --enable-werror=yes \
                      --enable-picky-compiler=yes \
                      --enable-platform-aws \
                      --with-cuda=/usr/local/cuda/
          make distcheck V=1
          make dist

      - name: Generate source packages
        if: matrix.generate_packages
        run: |
          echo "Generating packages for tag: ${PLUGIN_TAG}"
          ./contrib/scripts/generate_source_packages.sh "${PLUGIN_TAG}"

      - name: Validate expected artifacts
        if: matrix.generate_packages
        run: |
          set -e
          for f in "${TARBALL}" "${DSC}" "${DEBIAN_TAR}" "${SRPM}"; do
            if [ ! -f "${f}" ]; then
              echo "ERROR: Expected artifact missing: ${f}" >&2
              find . -maxdepth 1 -type f \( -name '*.tar*' -o -name '*.dsc' -o -name '*.rpm' \) -print
              exit 1
            fi
          done
          echo "All four expected artifacts present."

      - name: Upload artifacts
        if: matrix.generate_packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          path: |
            ${{ needs.metadata.outputs.tarball }}
            ${{ needs.metadata.outputs.dsc }}
            ${{ needs.metadata.outputs.debian_tar }}
            ${{ needs.metadata.outputs.srpm }}
          if-no-files-found: error

  create-release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release and upload assets
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
      IS_ALPHA: ${{ needs.metadata.outputs.is_alpha }}
      TARBALL: ${{ needs.metadata.outputs.tarball }}
      DSC: ${{ needs.metadata.outputs.dsc }}
      DEBIAN_TAR: ${{ needs.metadata.outputs.debian_tar }}
      SRPM: ${{ needs.metadata.outputs.srpm }}
      REPO: ${{ github.repository }}
    steps:
      # Runs first so that a rerun for a tag that already has a release stops
      # before anything is attested or uploaded for it.
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never modify an existing release for this tag (drafts included;
          # GitHub allows several drafts per tag). A candidate is immutable:
          # fix forward with the next alpha instead.
          existing=$(gh api "repos/${REPO}/releases" --paginate \
                       --jq '.[] | select(.tag_name == env.TAG) | .html_url')
          if [ -n "${existing}" ]; then
            echo "::error title=Release already exists::${TAG} already has a release: ${existing}"
            echo "Refusing to modify an existing release; release candidates are immutable." >&2
            echo "- If that release is complete or was handed to qualification, fix forward" >&2
            echo "  with the next alpha tag." >&2
            echo "- If it is an incomplete draft that nobody has qualified (for example, an" >&2
            echo "  asset upload failed), a maintainer may delete the draft release (never" >&2
            echo "  the tag) and rerun this workflow." >&2
            exit 1
          fi

      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          sparse-checkout: RELEASENOTES.md
          sparse-checkout-cone-mode: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-ubuntu
          path: release-artifacts

      - name: Validate artifact set
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' "${TARBALL}" "${DSC}" "${DEBIAN_TAR}" "${SRPM}" | sort)
          actual=$(find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${expected}" != "${actual}" ]; then
            echo "ERROR: release artifact set does not match the expected four files" >&2
            diff <(echo "${expected}") <(echo "${actual}") >&2 || true
            exit 1
          fi
          echo "Artifact set matches exactly:"
          (cd release-artifacts && sha256sum "${TARBALL}" "${DSC}" "${DEBIAN_TAR}" "${SRPM}")

      - name: Prepare release notes
        run: |
          set -euo pipefail
          awk -v tag="${TAG}" '
          index($0, "# " tag " (") == 1 { found = 1; printing = 1; print; next }
          printing && /^# v[0-9]/ { exit }
          printing { print }
          END {
            if (!found) {
              print "No specific release notes found for " tag > "/dev/stderr"
              exit 1
            }
          }' RELEASENOTES.md > RELEASE_NOTES.md

          CHECKSUM=$(cd release-artifacts && sha512sum "${TARBALL}")
          printf "\nChecksum (sha512) for the release tarball \`%s\`:\n\n\`\`\`\n%s\n\`\`\`\n" \
            "${TARBALL}" "${CHECKSUM}" >> RELEASE_NOTES.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--repo "${REPO}" --verify-tag --draft
                --title "AWS OFI NCCL ${TAG}" --notes-file RELEASE_NOTES.md)
          if [ "${IS_ALPHA}" = "true" ]; then
            args+=(--prerelease)
          fi
          url=$(gh release create "${TAG}" "${args[@]}" \
                  "release-artifacts/${TARBALL}" \
                  "release-artifacts/${DSC}" \
                  "release-artifacts/${DEBIAN_TAR}" \
                  "release-artifacts/${SRPM}")
          echo "Created draft: ${url}"
